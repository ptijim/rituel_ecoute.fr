// === PATCH: Edit wiring (robuste) ===
(function(){
  // Helpers
  window.MUSIC_DATA = window.MUSIC_DATA || [];
  function saveToLocal(){ try{ localStorage.setItem("MUSIC_DATA_JSON", JSON.stringify(window.MUSIC_DATA||[])); }catch(e){} }
  function loadFromLocal(){ try{ const s=localStorage.getItem("MUSIC_DATA_JSON"); if(s){ const a=JSON.parse(s); if(Array.isArray(a)) return a; } }catch(e){} return (window.MUSIC_DATA||[]); }
  function indexByDate(arr){ const m=new Map(); for(const x of arr){ if(x&&x.date){ m.set(x.date.slice(0,10), x); } } return m; }
  function htmlEscape(s){ return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }

  // state
  window.DATA = window.DATA || loadFromLocal();
  let CURRENT_DATE = null;

  function setEditMode(on){
    const fields = document.getElementById("editFields");
    const btnEdit = document.getElementById("editBtn");
    const btnSave = document.getElementById("saveBtn");
    const btnCancel = document.getElementById("cancelBtn");
    if(fields) fields.classList.toggle("hidden", !on);
    if(btnSave) btnSave.classList.toggle("hidden", !on);
    if(btnCancel) btnCancel.classList.toggle("hidden", !on);
    if(btnEdit) btnEdit.classList.toggle("hidden", on);
  }

  function saveEdit(){
    if(!CURRENT_DATE) return;
    const t   = (document.getElementById("editTitre")?.value   || "").trim();
    const a   = (document.getElementById("editAuteur")?.value  || "").trim();
    const o   = (document.getElementById("editOrigine")?.value || "").trim();
    const ins = (document.getElementById("editInstr")?.value   || "").trim();
    const yt  = (document.getElementById("editYT")?.value      || "").trim();

    const idx = DATA.findIndex(x => x && x.date && x.date.slice(0,10) === CURRENT_DATE);
    const obj = idx>=0 ? {...DATA[idx]} : {date: CURRENT_DATE};
    if(t) { obj.title = t; obj.titre = t; }
    if(a) { obj.author = a; obj.auteur = a; }
    obj.year = obj.year || obj.annee || obj["année"] || "";
    obj.annee = obj.year;
    obj.origin = o; obj["origine (pays auteur)"] = o;
    obj.instruments = ins;
    obj.youtube = yt;

    if(idx>=0) DATA[idx] = obj; else DATA.push(obj);
    window.MUSIC_DATA = DATA;
    saveToLocal();
    if(typeof renderDetail === "function") renderDetail(CURRENT_DATE);
    if(typeof renderCalendar === "function") renderCalendar();
    setEditMode(false);
  }

  function bindEditButtons(){
    const editBtn = document.getElementById("editBtn");
    const saveBtn = document.getElementById("saveBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    if(editBtn && !editBtn.__bound){ editBtn.__bound = true; editBtn.addEventListener("click", ()=> setEditMode(true)); }
    if(saveBtn && !saveBtn.__bound){ saveBtn.__bound = true; saveBtn.addEventListener("click", saveEdit); }
    if(cancelBtn && !cancelBtn.__bound){ cancelBtn.__bound = true; cancelBtn.addEventListener("click", ()=> setEditMode(false)); }
  }

  // Extend renderDetail to prefill & wire
  const prevRenderDetail = window.renderDetail;
  window.renderDetail = function(dateStr){
    CURRENT_DATE = dateStr;
    if(prevRenderDetail) prevRenderDetail(dateStr);
    const map = indexByDate(DATA);
    const item = map.get(dateStr) || {};
    const get = (k) => item[k] || item[k.toLowerCase()] || "";
    const et = document.getElementById("editTitre");   if(et) et.value = get("title") || get("titre");
    const ea = document.getElementById("editAuteur");  if(ea) ea.value = get("author") || get("auteur");
    const eo = document.getElementById("editOrigine"); if(eo) eo.value = get("origin") || get("origine (pays auteur)");
    const ei = document.getElementById("editInstr");   if(ei) ei.value = get("instruments");
    const ey = document.getElementById("editYT");      if(ey) ey.value = get("youtube") || get("lien youtube");
    setEditMode(false);
    bindEditButtons();
  };

  // Initial bind & also try later once (for browsers delaying DOM)
  document.addEventListener("DOMContentLoaded", ()=>{
    bindEditButtons();
    setTimeout(bindEditButtons, 300);
  });
})();

</script>

<body class="bg-slate-50 text-slate-900">
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">♪</div>
        <div>
          <h1 class="text-2xl md:text-3xl font-black header-title fun-title">Écoute musicale</h1>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="todayBtn" class="today-btn">▶ Morceau du jour</button>
        <span style="display:none"><button id="navCalendar" class="px-3 py-2 rounded-xl bg-slate-800 text-white btn-modern">Calendrier</button></span>
        <button id="navExport" class="px-3 py-2 rounded-xl bg-blue-600 text-white btn-modern">Exporter Excel</button>
        <a class="pdf-link" href="fiche_ecoute.pdf" target="_blank">Fiche élève</a>
      </div>
    </header>

    <section class="mt-4 rounded-2xl border bg-white shadow p-4 space-y-3 card teacher-panel">
      <h2 class="font-bold"></h2>
      <div class="grid md:grid-cols-3 gap-3">
        <div class="md:col-span-2">
          <input id="file" type="file" accept=".xlsx,.xls,.csv" class="text-sm"/>
          <p id="importStatus" class="text-xs text-emerald-700 mt-1"></p>
        </div>
      </div>
    </section>

    <section id="viewCalendar" class="view mt-4 rounded-2xl border bg-white shadow p-4 card show">
      <div class="calendar-toolbar">
        <div class="flex gap-2 teacher-panel">
          <button id="editBtn" class="px-3 py-2 rounded-xl bg-amber-500 text-white btn-modern">✏️ Modifier</button>
          <button id="saveBtn" class="hidden px-3 py-2 rounded-xl bg-emerald-600 text-white btn-modern">💾 Enregistrer</button>
          <button id="cancelBtn" class="hidden px-3 py-2 rounded-xl bg-slate-300 text-slate-800 btn-modern">Annuler</button>
        </div>
        <div id="yearLbl" hidden></div>
        <div class="count-chip">Ce mois : <span id="countMonth">0</span> morceaux</div>
      </div>

      <div class="month-nav">
        <button id="prev" class="nav-arrow" aria-label="Mois précédent">◀</button>
        <div id="monthLbl" class="month-label">—</div>
        <button id="next" class="nav-arrow" aria-label="Mois suivant">▶</button>
      </div>
      <div id="calendarWeekdays" aria-hidden="true">
        <span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span>
      </div>
      <div id="grid" class="mt-3 grid grid-cols-7 gap-2"></div>

      <div class="month-list">
        <h3 class="font-semibold mb-2">Morceaux du mois <span class="badge" id="badgeMonth">—</span></h3>
        <div id="list" class="max-h-64 overflow-auto pr-2 scrollbar-thin"></div>
      </div>
    </section>

    <section id="viewDetail" class="view hidden mt-4 rounded-2xl border bg-white shadow p-5 space-y-3 card">
      <div class="detail-top">
        <button id="backBtn" class="back-btn">← Calendrier</button>
        <div class="detail-date">
          <div class="text-slate-500 text-sm">Date du rituel</div>
          <div id="dateLbl" class="text-lg font-semibold">—</div>
        </div>
        <div class="flex gap-2 teacher-panel">
          <button id="editBtn" class="px-3 py-2 rounded-xl bg-amber-500 text-white btn-modern">✏️ Modifier</button>
          <button id="saveBtn" class="hidden px-3 py-2 rounded-xl bg-emerald-600 text-white btn-modern">💾 Enregistrer</button>
          <button id="cancelBtn" class="hidden px-3 py-2 rounded-xl bg-slate-300 text-slate-800 btn-modern">Annuler</button>
        </div>
      </div>

      <div class="detail-layout">
        <div class="player-col">
          <div class="info-hero">
            <div id="titre" class="track-title">—</div>
            <div id="auteur" class="track-artist">—</div>
          </div>
          <div class="player-frame">
            <iframe id="ytFrame" width="100%" height="100%" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
          </div>
        </div>

        <aside class="meta-col">
          <div class="artist-card">
            <img id="authorImg" src="" alt="Photo auteur" />
            <div>
              <div id="authorImgStatus" class="text-xs text-slate-500">Recherche d’une image sur Wikipédia…</div>
              <div id="authorImgCredit" class="text-xs text-slate-400"></div>
            </div>
          </div>
          <div class="meta-card">
            <div class="meta-label">Origine <span id="flagIcon"></span></div>
            <div id="origine" class="meta-value">—</div>
          </div>
          <div class="meta-card">
            <div class="meta-label">Instruments</div>
            <div id="instruments" class="meta-value">—</div>
            <button id="toggleInstr" class="toggle-instr">Masquer / afficher</button>
          </div>

<script>
try{ localStorage.removeItem("MUSIC_DATA_JSON"); }catch(e){}

// ===== Utils =====
function htmlEscape(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
function pad(n){ return String(n).padStart(2,"0"); }
function monthLabel(y,m){
  const noms=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  return noms[m]+" "+y;
}
function lowerNoAccents(s){ return String(s||"").normalize("NFD").replace(/\p{Diacritic}+/gu,"").toLowerCase().trim(); }
function norm(s){ return (s||"").toString().trim(); }

async function readFileArrayBuffer(file){
  if(file.arrayBuffer){ return await file.arrayBuffer(); }
  return await new Promise((resolve, reject)=>{ const fr=new FileReader(); fr.onload=()=>resolve(fr.result); fr.onerror=()=>reject(fr.error); fr.readAsArrayBuffer(file); });
}
async function readFileText(file){
  if(file.text){ return await file.text(); }
  return await new Promise((resolve, reject)=>{ const fr=new FileReader(); fr.onload=()=>resolve(fr.result); fr.onerror=()=>reject(fr.error); fr.readAsText(file,"utf-8"); });
}
function mapHeaders(hdr){
  // Lecture tolérante des intitulés du nouveau musique.xlsx.
  // On accepte accents, apostrophes, espaces insécables et variantes de noms.
  const clean = s => lowerNoAccents(String(s||"")
    .replace(/[\u00A0\u2007\u202F]/g," ")
    .replace(/[’‘`]/g,"'")
    .replace(/[\"«»]/g,"")
    .replace(/\s+/g," ").trim());
  const low = hdr.map(clean);
  const aliases = {
    date:["date","jour","day","date du morceau","date de diffusion"],
    titre:["titre","title","morceau","oeuvre","œuvre","piece","titre de l'oeuvre","titre de l œuvre","nom de l'oeuvre","nom de l œuvre"],
    auteur:["auteur","artiste","artist","groupe","interprete","interpret","compositeur","compositeur artiste","auteur artiste","artiste auteur","nom de l'artiste","nom de l auteur","nom de l'artiste / groupe"],
    origin:["origine (pays auteur)","origine","pays","pays d'origine","pays de l'auteur","origine du morceau"],
    instr:["instruments","instrument","instruments utilisés","instruments utilises"],
    yt:["Lien YouTube (vérifiée)","lien youtube (vérifiée)","Lien YouTube vérifiée","lien youtube verifiee"],
    year:["année","annee","year","an","année de création","annee de creation","annee creation","année creation","année du morceau","annee du morceau","année de l'oeuvre","annee de l'oeuvre"]
  };
  function exactOrContains(key){
    const names=aliases[key].map(clean);
    // priorité à la correspondance exacte
    for(const name of names){ const i=low.indexOf(name); if(i>=0) return i; }
    // puis aux intitulés plus longs contenant l'intitulé attendu
    for(let i=0;i<low.length;i++){
      const h=low[i];
      if(!h) continue;
      for(const name of names){
        if(name && (h.includes(name) || name.includes(h))) return i;
      }
    }
    return -1;
  }
  return {
    date: exactOrContains("date"),
    titre: exactOrContains("titre"),
    auteur: exactOrContains("auteur"),
    origin: exactOrContains("origin"),
    instr: exactOrContains("instr"),
    yt: exactOrContains("yt"),
    year: exactOrContains("year")
  };
}

function findHeaderRow(rows){
  // Certains fichiers Excel comportent une ligne de titre avant les en-têtes.
  // On cherche donc la vraie ligne d'en-têtes dans les 12 premières lignes.
  let best={index:0,map:mapHeaders(rows[0]||[]),score:-1};
  const max=Math.min(rows.length,12);
  for(let i=0;i<max;i++){
    const map=mapHeaders(rows[i]||[]);
    const score=[map.date,map.titre,map.auteur,map.year,map.origin,map.instr,map.yt].filter(x=>x>=0).length;
    if(score>best.score) best={index:i,map,score};
    if(map.date>=0 && map.titre>=0 && map.auteur>=0) return {index:i,map};
  }
  return best;
}
function toISODate(value){
  if(value == null || value === "") return "";
  if(value instanceof Date && !isNaN(value)) {
    return value.getFullYear()+"-"+pad(value.getMonth()+1)+"-"+pad(value.getDate());
  }
  if(typeof value === "number" && typeof XLSX !== "undefined" && XLSX.SSF){
    const d = XLSX.SSF.parse_date_code(value);
    if(d) return d.y+"-"+pad(d.m)+"-"+pad(d.d);
  }
  const v = String(value).trim();
  let m = v.match(/^(\\d{1,2})[\\/.-](\\d{1,2})[\\/.-](\\d{4})$/);
  if(m) return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);
  m = v.match(/^(\\d{4})[\\/.-](\\d{1,2})[\\/.-](\\d{1,2})/);
  if(m) return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);
  const d = new Date(v);
  return isNaN(d) ? "" : d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}

function normalizeYear(value){
  if(value == null || value === "") return "";
  if(typeof value === "number" && isFinite(value)) return String(Math.trunc(value));
  const m = String(value).match(/\\b(1[0-9]{3}|20[0-9]{2}|21[0-9]{2})\\b/);
  return m ? m[1] : String(value).trim();
}

function displayTitle(item){
  const title = String(item?.title ?? item?.titre ?? "").trim();
  const year = normalizeYear(item?.year ?? item?.annee ?? item?.["année"]);
  if(!title) return "Titre";
  if(!year) return title;
  // Évite les doublons si l'ancien fichier contient déjà l'année dans le titre.
  const withoutYear = title.replace(/\\s*\\((1[0-9]{3}|20[0-9]{2}|21[0-9]{2})\\)\\s*$/,"").trim();
  return `${withoutYear} (${year})`;
}

async function importFile(file){
  const ext = (file.name.split(".").pop()||"").toLowerCase();
  let rows=[];
  try{
    if(ext==="csv"){
      const txt = await readFileText(file);
      rows = txt.split(/\r?\n/).filter(Boolean).map(line=> line.split(",").map(x=>x.replace(/^"|"$/g,"")));
    }else{
      const buf = await readFileArrayBuffer(file);
      const wb = XLSX.read(buf, {type:"array"});
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, {header:1});
    }
  }catch(e){
    importStatus.textContent = "Erreur de lecture : " + e;
    return;
  }
  if(!rows.length){ importStatus.textContent = "Fichier vide."; return; }
  const hdr = (rows[0]||[]).map(x=> String(x||"").trim());
  const map = mapHeaders(hdr);
  if(map.date<0 || map.titre<0 || map.auteur<0){ importStatus.textContent = "Colonnes minimales manquantes : date, titre, auteur."; return; }

  let updated=0, inserted=0;
  for(const r of rows.slice(1)){
    const date = toISODate(r[map.date]); if(!date) continue;
    const obj = {
      date,
      title: norm(r[map.titre]),
      auteur: norm(r[map.auteur]),
      author: norm(r[map.auteur]),
      year: map.year>=0 ? normalizeYear(r[map.year]) : "",
      annee: map.year>=0 ? normalizeYear(r[map.year]) : "",
      origin: map.origin>=0 ? norm(r[map.origin]) : "",
      instruments: map.instr>=0 ? norm(r[map.instr]) : "",
      youtube: map.yt>=0 ? norm(r[map.yt]) : "",
    };
    if(dataMap.has(date)){ dataMap.set(date, {...dataMap.get(date), ...obj}); updated++; }
    else { dataMap.set(date, obj); inserted++; }
  }
  DATA = Array.from(dataMap.values()).sort((a,b)=> (a.date<b.date?-1:1));
  window.MUSIC_DATA = DATA;
  saveToLocal();
  importStatus.textContent = `Import terminé : ${updated} mis à jour, ${inserted} ajoutés.`;
  renderCalendar(); // refresh
}

function renderCalendar(){

}

// ===== Media helpers (YouTube, Map, Author Image) =====
function toYouTubeEmbed(url){
  if(!url) return "";
  try{
    const u = new URL(url);
    // youtu.be/<id>
    if(u.hostname.includes("youtu.be")){
      const id = u.pathname.replace("/","");
      return "https://www.youtube.com/embed/" + id;
    }
    // youtube.com/watch?v=<id>
    if(u.hostname.includes("youtube.com")){
      const id = u.searchParams.get("v");
      if(id) return "https://www.youtube.com/embed/" + id;
      // playlist or others: try to keep as is
      return "https://www.youtube.com/embed/";
    }
  }catch(e){}
  return "";
}

function toMapEmbed(place){
  if(!place) return "";
  // Utilise l'URL d'intégration libre de Google Maps sans clé
  // NB: nécessite internet au moment de l'affichage
  const q = encodeURIComponent(place);
  return "https://www.google.com/maps?q=" + q + "&output=embed";
}

// Cache pour images d'auteur (localStorage)
function cacheGet(key){
  try{ const s=localStorage.getItem(key); if(!s) return null; return JSON.parse(s); }catch(e){ return null; }
}
function cacheSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
}

async function fetchAuthorImage(author){
  const statusEl = document.getElementById("authorImgStatus");
  const creditEl = document.getElementById("authorImgCredit");
  const imgEl = document.getElementById("authorImg");
  const name = (author||"").trim();
  if(!name){ imgEl.src=""; statusEl.textContent="Aucun auteur."; return; }

  const CACHE_KEY = "AUTHOR_IMG_" + name.toLowerCase();
  const cached = cacheGet(CACHE_KEY);
  if(cached && cached.url){
    imgEl.src = cached.url;
    statusEl.textContent = "Image mise en cache.";
    creditEl.textContent = cached.credit || "";
    return;
  }

  statusEl.textContent = "Recherche sur Wikipédia FR…";
  // 1) Wikipédia FR
  try{
    const url = "https://fr.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages|info&inprop=url&piprop=thumbnail&pithumbsize=400&titles=" + encodeURIComponent(name);
    const r = await fetch(url);
    if(r.ok){
      const j = await r.json();
      const pages = j?.query?.pages || {};
      const first = Object.values(pages)[0];
      const thumb = first?.thumbnail?.source;
      if(thumb){
        imgEl.src = thumb;
        statusEl.textContent = "Image trouvée sur Wikipédia (FR).";
        creditEl.textContent = first?.fullurl ? ("Source : " + first.fullurl) : "";
        cacheSet(CACHE_KEY, {url: thumb, credit: creditEl.textContent});
        return;
      }
    }
  }catch(e){}

  statusEl.textContent = "Recherche sur Wikipédia EN…";
  // 2) Wikipédia EN
  try{
    const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages|info&inprop=url&piprop=thumbnail&pithumbsize=400&titles=" + encodeURIComponent(name);
    const r = await fetch(url);
    if(r.ok){
      const j = await r.json();
      const pages = j?.query?.pages || {};
      const first = Object.values(pages)[0];
      const thumb = first?.thumbnail?.source;
      if(thumb){
        imgEl.src = thumb;
        statusEl.textContent = "Image trouvée sur Wikipédia (EN).";
        creditEl.textContent = first?.fullurl ? ("Source : " + first.fullurl) : "";
        cacheSet(CACHE_KEY, {url: thumb, credit: creditEl.textContent});
        return;
      }
    }
  }catch(e){}

  // 3) Échec
  imgEl.src = "";
  statusEl.textContent = "Aucune image trouvée automatiquement.";
  creditEl.textContent = "";
}

        document.getElementById("saveBar").style.display="none";
      }catch(e){}
    };
  }

  // Force l'affichage des boutons d'édition quand on passe en mode édition
  function setEditMode(on){
    const fields = document.getElementById("editFields");
    const btnEdit = document.getElementById("editBtn");
    const btnSave = document.getElementById("saveBtn");
    const btnCancel = document.getElementById("cancelBtn");
    if(fields) fields.classList.toggle("hidden", !on);
    if(btnSave) btnSave.classList.toggle("hidden", !on);
    if(btnCancel) btnCancel.classList.toggle("hidden", !on);
    if(btnEdit) btnEdit.classList.toggle("hidden", on);
    // Affiche la barre flottante
    const bar = document.getElementById("saveBar");
    if(bar) bar.style.display = on ? "block" : "none";
  }
  // Délégation de clics
  document.addEventListener("click", function(ev){
    const id = ev.target && ev.target.id;
    if(id==="editBtn"){ ev.preventDefault(); setEditMode(true); }
    if(id==="cancelBtn"){ ev.preventDefault(); setEditMode(false); }
    if(id==="saveBtn"){ ev.preventDefault(); window.saveEdit(); }
    if(id==="saveBarBtn"){ ev.preventDefault(); window.saveEdit(); }
  }, true);

  // Dès qu'on modifie un champ, s'assurer que les boutons de sauvegarde sont visibles
  function onAnyEdit(){
    setEditMode(true);
  }
  ["editTitre","editAuteur","editOrigine","editInstr","editYT"].forEach(id=>{
    const el = document.getElementById(id);
    if(el){
      el.addEventListener("input", onAnyEdit);
      el.addEventListener("change", onAnyEdit);
    }
  });
  // En cas de rerendu de la fiche, rebrancher les handlers rapidement
  window.addEventListener("hashchange", ()=>{
    setTimeout(()=>{
      ["editTitre","editAuteur","editOrigine","editInstr","editYT"].forEach(id=>{
        const el = document.getElementById(id);
        if(el){
          el.addEventListener("input", onAnyEdit);
          el.addEventListener("change", onAnyEdit);
        }
      });
    }, 80);
  });
})();
</script>

  function extractCountryCode(origin){

<script>
// === Lien Wikipédia cliquable sur l'auteur ===
(function(){
  function cacheGet(k){ try{ const s=localStorage.getItem(k); return s? JSON.parse(s): null; }catch(e){ return null; } }
  function cacheSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  async function wikipediaPageUrlFR(author){
    const url = "https://fr.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=info&inprop=url&titles=" + encodeURIComponent(author);
    const r = await fetch(url);
    if(!r.ok) return null;
    const j = await r.json();
    const pages = j?.query?.pages || {};
    const first = Object.values(pages)[0];
    if(first && first.fullurl && !/Special:Search/.test(first.fullurl)) return first.fullurl;
    return null;
  }
  async function wikipediaPageUrlEN(author){
    const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=info&inprop=url&titles=" + encodeURIComponent(author);
    const r = await fetch(url);
    if(!r.ok) return null;
    const j = await r.json();
    const pages = j?.query?.pages || {};
    const first = Object.values(pages)[0];
    if(first && first.fullurl && !/Special:Search/.test(first.fullurl)) return first.fullurl;
    return null;
  }

  async function getWikipediaUrl(author){
    const key = "WIKI_URL_" + author.toLowerCase();
    const cached = cacheGet(key);
    if(cached) return cached;
    // FR then EN
    let url = await wikipediaPageUrlFR(author);
    if(!url) url = await wikipediaPageUrlEN(author);
    if(!url) url = null;
    cacheSet(key, url);
    return url;
  }

  async function setAuthorLink(author){
    const el = document.getElementById("auteur");
    if(!el){ return; }
    const name = (author||"").trim();
    if(!name){ el.textContent = "—"; return; }
    // Put a temporary text while resolving
    el.textContent = name;
    try{
      const page = await getWikipediaUrl(name);
      if(page){
        el.innerHTML = '<a href="'+page.replace(/"/g,'&quot;')+'" target="_blank" class="underline text-indigo-600 hover:text-indigo-800">'+name+' ↗</a>';
      }else{
        el.textContent = name; // no link found
      }
    }catch(e){
      el.textContent = name;
    }
  }

  // Hook into renderDetail so it updates the author field as a link
  const prevRenderDetail = window.renderDetail;
  window.renderDetail = function(dateStr){
    if(prevRenderDetail) prevRenderDetail(dateStr);
    const author = (document.getElementById("auteur")?.textContent || "").trim();
    setAuthorLink(author);
  };

  // After saveEdit, re-apply link in case author changed
  const prevSave = window.saveEdit;
  window.saveEdit = async function(){
    if(prevSave) prevSave();
    const author = (document.getElementById("auteur")?.textContent || "").trim();
    setAuthorLink(author);
  };

  // If opening directly on a fiche
  document.addEventListener("DOMContentLoaded", ()=>{
    const h = location.hash || "#/";
    if(h.startsWith("#/date=")){
      setTimeout(()=>{
        const author = (document.getElementById("auteur")?.textContent || "").trim();
        setAuthorLink(author);
      }, 120);
    }
  });
})();
</script>

<!-- LOCK FUTURE DAYS (student) — les morceaux restent accessibles dès le jour J et tous les jours suivants -->
<script>
(function(){
  function parisTodayYmd(){
    const s = new Date().toLocaleString('sv-SE', { timeZone: 'Europe/Paris', hour12:false });
    return s.slice(0,10);
  }
  function pad(n){ return String(n).padStart(2,"0"); }
  function isPastDay(ymd){
    const today = parisTodayYmd();
    // Débloqué le jour J ET reste définitivement accessible après le jour J.
    // Seuls les jours futurs sont verrouillés.
    return (ymd <= today);
  }
  function q(id){ return document.getElementById(id); }

  const _renderCalendarPrev = window.renderCalendar;
  window.renderCalendar = function(){
    const grid = q("grid");
    const list = q("list");
    const monthLbl = q("monthLbl");
    const yearLbl = q("yearLbl");
    const badgeMonth = q("badgeMonth");
    let y = (typeof curY!=="undefined") ? curY : (new Date()).getFullYear();
    let m = (typeof curM!=="undefined") ? curM : (new Date()).getMonth();

    function monthLabel(y,m){
      const noms=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
      return noms[m]+" "+y;
    }

    const DATA = (window.DATA || window.MUSIC_DATA || []);
    const map = new Map();
    for(const x of DATA){
      if(x && x.date){
        map.set(String(x.date).slice(0,10), x);
      }
    }

    monthLbl && (monthLbl.textContent = monthLabel(y, m));
    yearLbl && (yearLbl.textContent = y + "–" + (y+1));
    badgeMonth && (badgeMonth.textContent = monthLabel(y, m));

    if(grid) grid.innerHTML = "";
    if(list) list.innerHTML = "";

    const first = new Date(Date.UTC(y, m, 1));
    const startDay = (first.getUTCDay() + 6) % 7; // Lundi=0
    const daysInMonth = new Date(Date.UTC(y, m+1, 0)).getUTCDate();

    for(let i=0;i<startDay;i++){
      const div = document.createElement("div");
      div.className = "day rounded-xl bg-slate-100 border";
      grid && grid.appendChild(div);
    }

    let usedThisMonth = 0;
    const today = parisTodayYmd();

    for(let d=1; d<=daysInMonth; d++){
      const dateStr = `${y}-${pad(m+1)}-${pad(d)}`;
      const item = map.get(dateStr);
      const has = !!item;
      const past = isPastDay(dateStr);

      const cell = document.createElement("button");
      cell.type="button";
      cell.dataset.date = dateStr;
      let baseCls = "day rounded-xl border w-full text-left p-2 ";
      if(has && past){
        baseCls += "bg-emerald-50 border-emerald-200";
      }else if(has && !past){
        baseCls += "bg-slate-100 border-slate-200 opacity-70";
      }else{
        baseCls += "bg-white";
      }
      cell.className = baseCls;

      const title = item ? (typeof displayTitle==="function" ? displayTitle(item) : (item.title || item.titre || "Titre")) : "";
      const author = item ? (item.author || item.auteur || "") : "";
      const lockedLabel = (!past && has) ? `<div class="mt-1 text-xs text-amber-700">🔒 À découvrir ce jour-là</div>` : "";
      cell.innerHTML = `<div class="text-xs text-slate-500">${d}</div>`
        + (has
          ? (past
              ? `<div class="mt-1 font-semibold text-sm line-clamp-3">${title}</div><div class="text-xs text-slate-500 line-clamp-1">${author}</div>`
              : lockedLabel)
          : `<div class="text-xs text-slate-400 mt-1">—</div>`);

      cell.addEventListener("click", (ev)=>{
        if(has && past){
          location.hash = "#/date=" + dateStr;
        }else if(has && !past){
          ev.preventDefault();
          showToast("Cette fiche sera disponible après la journée 🎧");
        }
      }, true);

      grid && grid.appendChild(cell);

      if(has){
        usedThisMonth++;
        const row = document.createElement("div");
        row.className = "px-2 py-1 rounded text-sm flex items-center justify-between " + (past ? "hover:bg-slate-50" : "opacity-70");
        // >>> For future days, hide the real info in the list:
        const leftText = past
          ? `<span class="text-slate-500 text-xs">${dateStr}</span> — <b>${title}</b> <span class="text-slate-600">(${author})</span>`
          : `<span class="text-slate-500 text-xs">${dateStr}</span> — <i>À découvrir ce jour-là</i>`;
        const right = past
          ? `<a class="text-indigo-600 underline text-xs" href="#/date=${encodeURIComponent(dateStr)}">ouvrir</a>`
          : `<span class="text-amber-700 text-xs">🔒 verrouillé</span>`;
        row.innerHTML = `<div>${leftText}</div>${right}`;
        list && list.appendChild(row);
      }
    }
    const countMonth = q("countMonth");
    countMonth && (countMonth.textContent = usedThisMonth);
  };

  const _parseHashPrev = window.parseHash;
  window.parseHash = function(){
    const h = location.hash || "#/";
    if(h.startsWith("#/date=")){
      const d = decodeURIComponent(h.slice(7));
      if(!(d <= parisTodayYmd())){
        location.replace("#/");
        setTimeout(()=> showToast("Fiche disponible après la journée 🎧"), 30);
        return;
      }
    }
    if(typeof _parseHashPrev === "function"){
      return _parseHashPrev();
    }
  };

  function showToast(msg){
    let t = document.getElementById("toastLock");
    if(!t){
      t = document.createElement("div");
      t.id = "toastLock";
      Object.assign(t.style, {
        position:"fixed", bottom:"16px", right:"16px", background:"#f59e0b", color:"#fff",
        padding:"10px 14px", borderRadius:"12px", boxShadow:"0 10px 24px rgba(0,0,0,.15)",
        fontWeight:"600", zIndex:"99999", transition:"opacity .6s"
      });
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = "1";
    setTimeout(()=>{ t.style.opacity="0"; }, 1400);
  }

  window.addEventListener("hashchange", window.parseHash, true);
  document.addEventListener("DOMContentLoaded", function(){
    if(window.__modernInit) return; window.__modernInit = true;
    try { window.renderCalendar(); } catch(e){}
    setTimeout(()=> { try{ window.parseHash(); }catch(e){} }, 20);
  });
})();
</script>


<!-- Force FR date display (JJ-MM-AAAA) in calendar & detail -->
<script>
(function(){
  function toFR(iso){
    if(!iso || typeof iso!=="string") return iso||"";
    const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m) return iso;
    return `${m[3]}-${m[2]}-${m[1]}`;
  }
  function replaceDateTextIn(root){
    if(!root) return;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    const nodes = [];
    while(walker.nextNode()){ nodes.push(walker.currentNode); }
    for(const n of nodes){
      const t = n.nodeValue;
      if(!t) continue;
      const newT = t.replace(/\b(\d{4})-(\d{2})-(\d{2})\b/g, (m,y,mo,d)=> `${d}-${mo}-${y}`);
      if(newT !== t) n.nodeValue = newT;
    }
  }
  function patchAreas(){
    // calendar/list containers commonly used in these files
    const ids = ["grid","list","viewCalendar","viewDetail","app","root","content"];
    ids.forEach(id => { const el = document.getElementById(id); if(el) replaceDateTextIn(el); });
  }
  // Wrap renderCalendar to enforce FR formatting after each render
  const _rc = window.renderCalendar;
  window.renderCalendar = function(){
    try{ if(typeof _rc === "function") _rc.apply(this, arguments); }catch(e){}
    patchAreas();
    setTimeout(patchAreas, 25);
    setTimeout(patchAreas, 120);
  };
  // Wrap renderDetail similarly
  const _rd = window.renderDetail;
  window.renderDetail = function(){
    try{ if(typeof _rd === "function") _rd.apply(this, arguments); }catch(e){}
    const detail = document.getElementById("viewDetail") || document.body;
    replaceDateTextIn(detail);
    setTimeout(()=> replaceDateTextIn(detail), 60);
  };
  // Also handle initial load and navigation
  document.addEventListener("DOMContentLoaded", ()=>{
    patchAreas();
    setTimeout(patchAreas, 30);
  });
  window.addEventListener("hashchange", ()=>{
    patchAreas();
    setTimeout(patchAreas, 30);
  }, true);
  // Observe for dynamic mutations
  const obs = new MutationObserver(()=>{ patchAreas(); });
  obs.observe(document.documentElement, {subtree:true, childList:true});
})();
</script>


<!-- === AUTOLOAD : musique.xlsx avec année séparée === -->
<script>
(function(){
  "use strict";
  // PATCH DATE XLSX : les dates Excel sont traitées comme des dates calendaires, sans fuseau horaire.

  function ensureStatus(){
    return document.getElementById("importStatus");
  }
  function status(msg, kind){
    const el=ensureStatus();
    if(el){
      el.textContent=msg;
      el.className="text-xs mt-1";
      if(kind==="error") el.style.color="#fca5a5";
      else if(kind==="ok") el.style.color="#67e8f9";
      else el.style.color="#fbbf24";
    }
  }

  function excelSerialToISO(n){
    const epoch=Date.UTC(1899,11,30);
    const d=new Date(epoch + Math.round(Number(n)*86400*1000));
    if(isNaN(d)) return "";
    return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate());
  }

  function toISO(value){
    if(value==null || value==="") return "";

    // Pour musique.xlsx, on ne convertit plus les dates Excel en objet Date.
    // Le numéro de série Excel est converti directement en date UTC :
    // cela évite tout décalage d'un jour lié au fuseau horaire du navigateur.
    if(typeof value==="number") return excelSerialToISO(value);

    if(value instanceof Date && !isNaN(value)){
      return value.getUTCFullYear()+"-"+pad(value.getUTCMonth()+1)+"-"+pad(value.getUTCDate());
    }

    const v=String(value).trim();
    let m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
    if(m) return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);

    m=v.match(/^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})/);
    if(m) return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);

    const d=new Date(v);
    return isNaN(d) ? "" : d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  }

  function normalizeYear(value){
    if(value==null || value==="") return "";
    if(typeof value==="number" && isFinite(value)) return String(Math.trunc(value));
    const m=String(value).match(/\b(1[0-9]{3}|20[0-9]{2}|21[0-9]{2})\b/);
    return m ? m[1] : String(value).trim();
  }

  async function load(){
    status("Chargement automatique de « musique.xlsx »…","wait");

    try{
      if(typeof XLSX==="undefined") throw new Error("Bibliothèque XLSX indisponible.");

      const response=await fetch("musique.xlsx?ts="+Date.now(),{cache:"no-store"});
      if(!response.ok) throw new Error("musique.xlsx introuvable ("+response.status+").");

      const wb=XLSX.read(await response.arrayBuffer(),{type:"array",cellDates:false});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});

      if(!rows.length) throw new Error("Le fichier est vide.");

      const headerInfo=findHeaderRow(rows);
      const map=headerInfo.map;
      const headerRow=headerInfo.index;

      if(map.date<0 || map.titre<0 || map.auteur<0){
        const detected=(rows[headerRow]||[]).map(v=>String(v??"").trim()).filter(Boolean).join(" | ");
        throw new Error("Colonnes requises absentes. En-têtes détectés : " + (detected || "aucun"));
      }

      const fresh=[];
      for(const row of rows.slice(headerRow+1)){
        const date=toISO(row[map.date]);
        const title=norm(row[map.titre]);
        const author=norm(row[map.auteur]);
        if(!date || !title) continue;

        const year=map.year>=0 ? normalizeYear(row[map.year]) : "";

        fresh.push({
          date,
          title,
          titre:title,
          author,
          auteur:author,
          year,
          annee:year,
          "année":year,
          origin:map.origin>=0 ? norm(row[map.origin]) : "",
          instruments:map.instr>=0 ? norm(row[map.instr]) : "",

        });
      }

      fresh.sort((a,b)=>a.date.localeCompare(b.date));

      // Le nouveau musique.xlsx devient la source de vérité :

  if(document.readyState==="loading"){

<script>
(function(){
  // Transforme la liste d'instruments en liens Wikipédia (FR)
  function wikiLinkifyInstruments(text){
    if(!text) return "—";
    const parts = String(text).split(/[,;\/]/).map(s => s.trim()).filter(Boolean);
    if(!parts.length) return "—";
    const makeUrl = (name)=> "https://fr.wikipedia.org/wiki/" + encodeURIComponent(name.replace(/\s+/g, "_"));
    return parts.map(name => '<a class="link" href="'+makeUrl(name)+'" target="_blank" rel="noopener noreferrer">'+name+'</a>').join(", ");
  }

  // Essaie de dériver l'URL d'origine (pleine définition) depuis une miniature Wikimedia
  function getFullImageFromThumb(url){
    try{
      if(!url) return "";
      const u = new URL(url);
      // Miniatures Wikimedia: .../thumb/<path>/<filename>/<W>px-<filename>
      if(u.hostname.includes("wikimedia.org") && u.pathname.includes("/thumb/")){
        const parts = u.pathname.split("/thumb/");
        const left = parts[0]; // /wikipedia/commons
        const rest = parts[1]; // a/ab/Filename.jpg/400px-Filename.jpg
        const idx = rest.lastIndexOf("/");
        if(idx > -1){
          const basePath = rest.substring(0, idx); // a/ab/Filename.jpg
          return u.origin + left + "/" + basePath;
        }
      }
    }catch(e){}
    // fallback: retourne l'URL donnée
    return url;
  }

  // Lightbox pour l'image auteur
  function setupAuthorImageZoom(){
    const img = document.getElementById("authorImg");
    const flag = document.getElementById("flagIcon");
    const box = document.getElementById("imgLightbox");
    const big = document.getElementById("imgLightboxImg");
    const close = box ? box.querySelector(".close") : null;
    if(!box || !big) return;

    // Évite de réinstaller plusieurs fois les mêmes gestionnaires lors des changements de fiche.
    if(box.dataset.zoomBound !== "1"){
      box.dataset.zoomBound = "1";
      function closeBox(){
        box.style.display = "none";
        big.setAttribute("src","");
      }
      if(close) close.addEventListener("click", closeBox);
      box.addEventListener("click", function(ev){
        if(ev.target===box) closeBox();
      });
      document.addEventListener("keydown", function(ev){
        if(ev.key==="Escape") closeBox();
      });
    }

    function bind(target, kind){
      if(!target || target.dataset.zoomBound === "1") return;
      target.dataset.zoomBound = "1";
      target.style.cursor = "zoom-in";
      target.title = kind === "flag" ? "Cliquer pour agrandir le drapeau" : "Cliquer pour agrandir la photo";
      target.addEventListener("click", function(){
        const src = target.getAttribute("src") || "";
        if(!src) return;
        const hi = getFullImageFromThumb(src);
        big.setAttribute("src", hi || src);
        big.classList.toggle("zoom-flag", kind === "flag");
        big.alt = target.alt || (kind === "flag" ? "Drapeau" : "Photo de l'artiste");
        box.style.display = "flex";
      });
    }

    bind(img, "photo");
    // Le drapeau est généré dynamiquement : on cible aussi l'image qu'il contient.
    const flagImg = flag ? flag.querySelector("img") : null;
    bind(flagImg, "flag");
  }

  function observeFlagForZoom(){
    const flag = document.getElementById("flagIcon");
    if(!flag || flag.dataset.zoomObserver === "1") return;
    flag.dataset.zoomObserver = "1";
    const obs = new MutationObserver(function(){ setupAuthorImageZoom(); });
    obs.observe(flag, {childList:true, subtree:true});
  }

  // Surcouche finale de renderDetail : ajoute liens Wikipedia aux instruments
  (function(){
    const prev = window.renderDetail;
    window.renderDetail = function(dateStr){
      if(prev) prev(dateStr);
      try{
        const el = document.getElementById("instruments");
        if(el){
          const raw = el.textContent || el.innerText || "";
          el.innerHTML = wikiLinkifyInstruments(raw);
        }
      }catch(e){}
      // S'assurer que le zoom est câblé (au cas où le DOM a été rerendu)
      try{ setupAuthorImageZoom(); observeFlagForZoom(); }catch(e){}
    };
  })();

  // Au chargement initial (si fiche déjà ouverte)
  document.addEventListener("DOMContentLoaded", function(){
    if(window.__modernInit) return; window.__modernInit = true;
    setupAuthorImageZoom();
    observeFlagForZoom();
    const h = location.hash || "#/";
    if(h.startsWith("#/date=")){
      // forcer un post-traitement si déjà sur une fiche
      setTimeout(function(){
        try{
          const el = document.getElementById("instruments");
          if(el){
            const raw = el.textContent || el.innerText || "";
            el.innerHTML = wikiLinkifyInstruments(raw);
          }
        }catch(e){}
      }, 80);
    }
  });
})();
</script>

<script>
(function(){
  async function fetchWikiSummary(lang, title){
    const url = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent((title||'').replaceAll(' ','_'))}`;
    const r = await fetch(url);
    if(!r.ok) return null;
    const j = await r.json();
    return j.originalimage?.source || j.thumbnail?.source || null;
  }
  async function fetchWikiSearch(lang, query){
    const api = `https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query||'')}&format=json&origin=*`;
    const r = await fetch(api);
    if(!r.ok) return null;
    const j = await r.json();
    return j?.query?.search?.[0]?.title || null;
  }
  async function findArtistImageFichesStyle(data, langDefault){
    // data: {Auteur, Titre, Lang, Photo}
    // 1) URL fournie
    if(data?.Photo && /^https?:\/\//i.test(data.Photo.trim())) return data.Photo.trim();
    const langs = [];
    const base = (data?.Lang || langDefault || 'fr').trim().toLowerCase();
    if(base) langs.push(base);
    if(!langs.includes('fr')) langs.push('fr');
    if(!langs.includes('en')) langs.push('en');
    if(!langs.includes('es')) langs.push('es');
    if(!langs.includes('de')) langs.push('de');
    if(!langs.includes('it')) langs.push('it');

    const queries = [];
    if(data?.Auteur) queries.push(data.Auteur);
    if(data?.Titre) queries.push(data.Titre);
    if(data?.Auteur && data?.Titre) queries.push(`${data.Titre} ${data.Auteur}`);

    for(const L of langs){
      // essais directs
      for(const q of queries){
        const img = await fetchWikiSummary(L, q);
        if(img) return img;
      }
      // fallback via recherche
      for(const q of queries){
        const t = await fetchWikiSearch(L, q);
        if(t){
          const img = await fetchWikiSummary(L, t);
          if(img) return img;
        }
      }
    }
    return '';
  }

  function setPhotoStatus(msg){
    const el = document.getElementById('authorImgStatus');
    if(el) el.textContent = msg || '';
  }
  function setPhotoCredit(msg){
    const el = document.getElementById('authorImgCredit');
    if(el) el.textContent = msg || '';
  }
  function setPhotoURL(url, alt){
    const img = document.getElementById('authorImg');
    if(!img) return;
    if(url){
      img.style.display = '';
      img.alt = alt || 'Artiste';
      img.onload = ()=>{ setPhotoStatus(''); setPhotoCredit('Source : Wikipedia'); };
      img.onerror = ()=>{ setPhotoStatus('Photo indisponible'); setPhotoCredit(''); img.removeAttribute('src'); img.style.display='none'; };
      img.src = url;
    }else{
      img.removeAttribute('src'); img.style.display='none';
    }
  }

  // Essaie d'extraire les champs de la fiche courante
  function readDetailDataFallback(){
    const getText = (sel)=>{
      const el = document.querySelector(sel);
      return el ? (el.value ?? el.textContent ?? '').toString().trim() : '';
    };
    return {
      Auteur: getText('#detailAuthor, .detail-author, [data-detail=author]'),
      Titre:  getText('#detailTitle,  .detail-title,  [data-detail=title]'),
      Lang:   getText('#detailLang,   .detail-lang,   [data-detail=lang]'),
      Photo:  getText('#detailPhoto,  .detail-photo,  [data-detail=photo]')
    };
  }

  // Remplace l'ancienne API en restant compatible
  window.fetchAuthorImage = async function(author, title, lang, photoUrl){
    try{
      setPhotoStatus("Recherche d’une image sur Wikipédia…");
      setPhotoCredit('');
      setPhotoURL('', '');

      // Construire l'objet data dans l'esprit des fiches
      const data = {
        Auteur: (author||'').toString().trim(),
        Titre: (title||'').toString().trim(),
        Lang: (lang||'').toString().trim(),
        Photo: (photoUrl||'').toString().trim()
      };
      // Si rien n'est passé, tente de lire depuis la fiche
      if(!data.Auteur && !data.Titre){
        const fallback = readDetailDataFallback();
        data.Auteur = fallback.Auteur || data.Auteur;
        data.Titre  = fallback.Titre  || data.Titre;
        data.Lang   = fallback.Lang   || data.Lang;
        data.Photo  = fallback.Photo  || data.Photo;
      }

      // Timeout pour ne jamais rester bloqué
      let timedOut = false;
      const tid = setTimeout(()=>{
        timedOut = true;
        setPhotoStatus("Aucune photo trouvée");
        setPhotoCredit('');
        setPhotoURL('', '');
      }, 8000);

      const url = await findArtistImageFichesStyle(data, data.Lang||'fr');
      if(timedOut) return '';

      clearTimeout(tid);
      if(url){
        setPhotoURL(url, data.Auteur || data.Titre || 'Artiste');
        return url;
      }else{
        setPhotoStatus("Aucune photo trouvée");
        setPhotoCredit('');
        setPhotoURL('', '');
        return '';
      }
    }catch(e){
      setPhotoStatus("Photo indisponible");
      setPhotoCredit('');
      setPhotoURL('', '');
      console.warn('fetchAuthorImage error:', e);
      return '';
    }
  };
})();
</script>

</style>
<script>
(function(){
  const CACHE_PREFIX = "CALENDAR_ARTIST_IMG_V1_";
  const photoJobs = new Map();
  function normalizeKey(value){ return String(value || "").trim().toLowerCase(); }
  function cacheGet(key){ try{ const raw = localStorage.getItem(CACHE_PREFIX + key); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
  function cacheSet(key, value){ try{ localStorage.setItem(CACHE_PREFIX + key, JSON.stringify(value)); }catch(e){} }
  function dataByDate(){
    const arr = (typeof DATA !== "undefined" && Array.isArray(DATA) && DATA.length)
      ? DATA
      : (window.DATA || window.MUSIC_DATA || []);
    const map = new Map();
    for(const item of arr){ if(item && item.date){ map.set(String(item.date).slice(0,10), item); } }
    return map;
  }
  function pad2(n){ return String(n).padStart(2, "0"); }
  function dateFromCell(cell){
    if(cell.dataset.date) return cell.dataset.date;
    const dayText = (cell.querySelector("div")?.textContent || "").trim();
    const day = parseInt(dayText, 10);
    if(!day) return "";
    const y = (typeof curY !== "undefined") ? curY : new Date().getFullYear();
    const m = (typeof curM !== "undefined") ? curM : new Date().getMonth();
    return `${y}-${pad2(m + 1)}-${pad2(day)}`;
  }
  function parisTodayYmd(){
    try{ return new Date().toLocaleString("sv-SE", {timeZone:"Europe/Paris", hour12:false}).slice(0,10); }
    catch(e){ return new Date().toISOString().slice(0,10); }
  }
  function isUnlocked(dateStr){ return !dateStr || dateStr <= parisTodayYmd(); }
  function initials(name){
    const parts = String(name || "").replace(/\(.+?\)/g, "").trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return "♪";
    return parts.slice(0,2).map(p => p[0]).join("").toUpperCase();
  }
  async function fetchSummaryImage(lang, title){
    if(!title) return "";
    const url = `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(String(title).replaceAll(" ","_"))}`;
    const res = await fetch(url);
    if(!res.ok) return "";
    const json = await res.json();
    return json?.originalimage?.source || json?.thumbnail?.source || "";
  }
  async function fetchSearchTitle(lang, query){
    if(!query) return "";
    const url = `https://${lang}.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
    const res = await fetch(url);
    if(!res.ok) return "";
    const json = await res.json();
    return json?.query?.search?.[0]?.title || "";
  }
  // Résolution rapide et unifiée des photos : le calendrier et la fiche
  // utilisent exactement la même URL pour un artiste donné.
  const KNOWN_ARTIST_PHOTOS = {
    "pomme": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Pomme%20Bourges%20Autoharpe.jpg",
    "indochine": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Indochine%202009.JPG",
    "téléphone": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Festival%20des%20Vieilles%20Charrues%202016%20-%20Les%20Insus%20-%20039.jpg",
    "telephone": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Festival%20des%20Vieilles%20Charrues%202016%20-%20Les%20Insus%20-%20039.jpg",
    "clou": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Clou%20Cigale%2018-11-2021.jpg",
    "hervé": "https://commons.wikimedia.org/wiki/Special:Redirect/file/P2N2023Herve_1.jpg",
    "herve": "https://commons.wikimedia.org/wiki/Special:Redirect/file/P2N2023Herve_1.jpg",
    "the hu": "https://commons.wikimedia.org/wiki/Special:Redirect/file/2019%20RiP%20The%20Hu%20-%20by%202eight%20-%20ZSC2060.jpg"
  };
  const artistPhotoCacheKey = (author) => "UNIFIED_ARTIST_IMG_V2_" + normalizeKey(author);
  function readUnifiedPhoto(author){
    const key = normalizeKey(author);
    if(!key) return "";
    const known = KNOWN_ARTIST_PHOTOS[key];
    if(known) return known;
    try{
      const a = localStorage.getItem(artistPhotoCacheKey(author));
      if(a) return JSON.parse(a)?.url || "";
    }catch(e){}
    // Réutilise immédiatement la photo déjà trouvée par la fiche.
    try{
      const a = localStorage.getItem("AUTHOR_IMG_" + key);
      if(a) return JSON.parse(a)?.url || "";
    }catch(e){}
    return "";
  }
  function writeUnifiedPhoto(author, url){
    if(!author || !url) return;
    try{ localStorage.setItem(artistPhotoCacheKey(author), JSON.stringify({url})); }catch(e){}
    try{ localStorage.setItem("AUTHOR_IMG_" + normalizeKey(author), JSON.stringify({url, credit:"Source : Wikipedia/Wikimedia Commons"})); }catch(e){}
  }
  async function findArtistPhoto(item){
    const author = String(item.author || item.auteur || "").trim();
    const title = String(item.title || item.titre || "").trim();
    const explicit = String(item.photo || item.image || item.Photo || "").trim();
    if(/^https?:\/\//i.test(explicit)){ writeUnifiedPhoto(author, explicit); return explicit; }
    const key = normalizeKey(author || title);
    if(!key) return "";

    const unified = readUnifiedPhoto(author);
    if(unified) return unified;

    const cached = cacheGet(key);
    if(cached && cached.url){ writeUnifiedPhoto(author, cached.url); return cached.url; }
    if(cached && cached.miss) return "";
    if(photoJobs.has(key)) return photoJobs.get(key);

    const job = (async()=>{
      // Une seule recherche ciblée plutôt que plusieurs langues × plusieurs requêtes.
      // Cela accélère fortement le premier affichage du calendrier.
      const queries = [
        author ? `${author} chanteur` : title,
        author ? `${author} musicien` : title,
        author ? `${author} groupe musical` : title
      ].filter(Boolean);
      try{
        const searchResults = await Promise.all(queries.map(q => fetchSearchTitle("fr", q).catch(()=>"")));
        for(const foundTitle of searchResults){
          if(!foundTitle) continue;
          const img = await fetchSummaryImage("fr", foundTitle).catch(()=>"");
          if(img){ cacheSet(key, {url:img}); writeUnifiedPhoto(author, img); return img; }
        }
        // Dernier recours : une recherche anglaise, une seule.
        const foundEn = await fetchSearchTitle("en", `${author} musician`).catch(()=>"");
        if(foundEn){
          const img = await fetchSummaryImage("en", foundEn).catch(()=>"");
          if(img){ cacheSet(key, {url:img}); writeUnifiedPhoto(author, img); return img; }
        }
      }catch(e){}
      cacheSet(key, {miss:true});
      return "";
    })();
    photoJobs.set(key, job);
    return job.finally(()=> photoJobs.delete(key));
  }
  function addPlaceholder(cell, author){
    if(cell.querySelector(".calendar-photo-placeholder")) return;
    const ph = document.createElement("div");
    ph.className = "calendar-photo-placeholder";
    ph.textContent = initials(author);
    cell.prepend(ph);
  }
  function addPhotoToCell(cell, url, author){
    if(!url || cell.querySelector(".calendar-artist-photo")) return;
    cell.classList.add("has-artist-photo");
    cell.querySelectorAll(".calendar-photo-placeholder").forEach(el => el.remove());
    const img = document.createElement("img");
    img.className = "calendar-artist-photo";
    img.loading = "lazy";
    img.decoding = "async";
    img.alt = author ? `Photo de ${author}` : "Photo artiste";
    img.src = url;
    img.onerror = function(){ cell.classList.remove("has-artist-photo"); img.remove(); addPlaceholder(cell, author); };
    const shade = document.createElement("div");
    shade.className = "calendar-photo-shade";
    cell.prepend(shade);
    cell.prepend(img);
  }
  function enhanceCalendarPhotos(){
    const grid = document.getElementById("grid");
    if(!grid) return;
    const map = dataByDate();
    const cells = Array.from(grid.querySelectorAll(".day"));
    for(const cell of cells){
      const dateStr = dateFromCell(cell);
      if(dateStr) cell.dataset.date = dateStr;
      const item = map.get(dateStr);
      if(!item) continue;
      if(cell.dataset.artistPhotoReady === "1") continue;
      cell.dataset.artistPhotoReady = "1";
      const author = item.author || item.auteur || "";
      addPlaceholder(cell, author);
      findArtistPhoto(item).then(url => { if(url && document.body.contains(cell)) addPhotoToCell(cell, url, author); });
    }
  }
  window.__calendarArtistPhotoRefresh = enhanceCalendarPhotos;
  const previousRenderCalendar = window.renderCalendar;
  window.renderCalendar = function(){
    if(typeof previousRenderCalendar === "function") previousRenderCalendar.apply(this, arguments);
    enhanceCalendarPhotos();
  };
  document.addEventListener("DOMContentLoaded", function(){ enhanceCalendarPhotos(); });
  window.addEventListener("hashchange", function(){ setTimeout(enhanceCalendarPhotos, 80); }, true);
})();
</script>

<script>
(function(){
  function escapeHtml(value){
    return String(value == null ? "" : value).replace(/[&<>"']/g, function(char){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[char];
    });
  }
  function pad2(value){ return String(value).padStart(2, "0"); }
  function getDataArray(){
    if(typeof DATA !== "undefined" && Array.isArray(DATA)) return DATA;
    if(Array.isArray(window.DATA)) return window.DATA;
    if(Array.isArray(window.MUSIC_DATA)) return window.MUSIC_DATA;
    try{
      const saved = JSON.parse(localStorage.getItem("MUSIC_DATA_JSON") || "[]");
      return Array.isArray(saved) ? saved : [];
    }catch(e){ return []; }
  }
  function makeMap(){
    const map = new Map();
    getDataArray().forEach(function(item){
      if(item && item.date) map.set(String(item.date).slice(0,10), item);
    });
    return map;
  }
  function monthHasMusic(year, month){
    return getDataArray().some(function(item){
      const date = item && item.date ? String(item.date).slice(0,10) : "";
      return date.slice(0,7) === year + "-" + pad2(month + 1);
    });
  }
  function firstMusicMonth(){
    const dates = getDataArray()
      .map(function(item){ return item && item.date ? String(item.date).slice(0,10) : ""; })
      .filter(Boolean)
      .sort();
    if(!dates.length) return null;
    return { year:Number(dates[0].slice(0,4)), month:Number(dates[0].slice(5,7)) - 1 };
  }
  function moveToUsefulMonth(){
    if(location.hash && /\bdate=/.test(location.hash)) return false;
    if(typeof curY === "undefined" || typeof curM === "undefined") return false;
    if(monthHasMusic(curY, curM)) return false;
    const first = firstMusicMonth();
    if(!first) return false;
    curY = first.year;
    curM = first.month;
    return true;
  }
  function dateForCell(cell){
    if(cell.dataset.date) return cell.dataset.date;
    const firstNumber = (cell.textContent || "").match(/\d{1,2}/);
    if(!firstNumber) return "";
    const y = (typeof curY !== "undefined") ? curY : new Date().getFullYear();
    const m = (typeof curM !== "undefined") ? curM : new Date().getMonth();
    return y + "-" + pad2(m + 1) + "-" + pad2(firstNumber[0]);
  }
  function enhanceCalendarLayout(){
    const grid = document.getElementById("grid");
    if(!grid) return;
    const data = makeMap();
    Array.from(grid.querySelectorAll(".day")).forEach(function(cell){
      const date = dateForCell(cell);
      const item = data.get(date);
      if(!item){
        cell.classList.add("empty-calendar-cell");
        return;
      }
      cell.dataset.date = date;
      cell.classList.remove("empty-calendar-cell");
      cell.classList.add("enhanced-music-day");
      if(cell.dataset.finalCalendarUi === "1") return;
      const day = String(Number(date.slice(8,10)));
      const title = typeof displayTitle==="function" ? displayTitle(item) : (item.title || item.titre || "Morceau");
      const author = item.author || item.auteur || "Artiste";
      cell.innerHTML =
        '<span class="calendar-day-number">' + escapeHtml(day) + '</span>' +
        '<span class="calendar-open-badge" aria-hidden="true">›</span>' +
        '<div class="calendar-copy">' +
          '<span class="calendar-title">' + escapeHtml(title) + '</span>' +
          '<span class="calendar-author">' + escapeHtml(author) + '</span>' +
        '</div>';
      cell.setAttribute("aria-label", day + " : " + title + ", " + author + ". Ouvrir la fiche.");
      cell.dataset.finalCalendarUi = "1";
      cell.dataset.artistPhotoReady = "";
    });
  }
  function rerunEnhancers(){
    enhanceCalendarLayout();
    if(typeof window.__calendarArtistPhotoRefresh === "function"){
      window.__calendarArtistPhotoRefresh();
    }
  }
  const previousRenderCalendar = window.renderCalendar;
  window.renderCalendar = function(){
    if(typeof previousRenderCalendar === "function") previousRenderCalendar.apply(this, arguments);
    rerunEnhancers();
  };
  document.addEventListener("DOMContentLoaded", function(){
    if(moveToUsefulMonth() && typeof window.renderCalendar === "function"){
      window.renderCalendar();
      return;
    }
    rerunEnhancers();
  });
  window.addEventListener("hashchange", function(){ setTimeout(rerunEnhancers, 80); }, true);
})();
</script>

<script>
(function(){
  'use strict';

  const ARTIST_FIXES = {
    'pomme': {
      wiki: 'https://fr.wikipedia.org/wiki/Pomme_(chanteuse)',
      image: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Pomme%20Bourges%20Autoharpe.jpg'
    },
    'indochine': {
      wiki: 'https://fr.wikipedia.org/wiki/Indochine_(groupe)',
      image: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Indochine%202009.JPG'
    },
    'téléphone': {
      wiki: 'https://fr.wikipedia.org/wiki/Téléphone_(groupe)',
      image: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Festival%20des%20Vieilles%20Charrues%202016%20-%20Les%20Insus%20-%20039.jpg'
    },
    'telephone': {
      wiki: 'https://fr.wikipedia.org/wiki/Téléphone_(groupe)',
      image: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Festival%20des%20Vieilles%20Charrues%202016%20-%20Les%20Insus%20-%20039.jpg'
    },
    'clou': {
      wiki: 'https://fr.wikipedia.org/wiki/Clou_(chanteuse)',
      image: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Clou%20Cigale%2018-11-2021.jpg'
    },
    'hervé': {
      wiki: 'https://fr.wikipedia.org/wiki/Hervé_(chanteur)',
      image: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/P2N2023Herve_1.jpg'
    },
    'herve': {
      wiki: 'https://fr.wikipedia.org/wiki/Hervé_(chanteur)',
      image: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/P2N2023Herve_1.jpg'
    },
    'the hu': {
      wiki: 'https://fr.wikipedia.org/wiki/The_Hu',
      image: 'https://commons.wikimedia.org/wiki/Special:Redirect/file/2019%20RiP%20The%20Hu%20-%20by%202eight%20-%20ZSC2060.jpg'
    }
  };

  function norm(s){
    return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
  }
  function dataArray(){
    if(Array.isArray(window.DATA) && window.DATA.length) return window.DATA;
    try { if(typeof DATA !== 'undefined' && Array.isArray(DATA)) return DATA; } catch(e){}
    if(Array.isArray(window.MUSIC_DATA) && window.MUSIC_DATA.length) return window.MUSIC_DATA;
    try { const a=JSON.parse(localStorage.getItem('MUSIC_DATA_JSON')||'[]'); if(Array.isArray(a)) return a; } catch(e){}
    return [];
  }
  function itemForDate(date){
    const d=String(date||'').slice(0,10);
    return dataArray().find(x=>x && String(x.date||'').slice(0,10)===d) || null;
  }
  function keyFor(author){ return norm(author); }

  function fixedArtist(author){ return ARTIST_FIXES[keyFor(author)] || null; }

  async function wikidataImage(author){
    const q=String(author||'').trim();
    if(!q) return '';
    try{
      const search='https://www.wikidata.org/w/api.php?action=wbsearchentities&search='+encodeURIComponent(q)+'&language=fr&uselang=fr&format=json&origin=*&limit=5';
      const sr=await fetch(search);
      if(!sr.ok) return '';
      const sj=await sr.json();
      for(const r of (sj.search||[])){
        const id=r.id;
        const er=await fetch('https://www.wikidata.org/w/api.php?action=wbgetentities&ids='+encodeURIComponent(id)+'&props=claims|labels|descriptions&languages=fr&format=json&origin=*');
        if(!er.ok) continue;
        const ej=await er.json();
        const ent=ej.entities && ej.entities[id];
        const claims=ent && ent.claims || {};
        const p18=claims.P18 && claims.P18[0] && claims.P18[0].mainsnak && claims.P18[0].mainsnak.datavalue && claims.P18[0].mainsnak.datavalue.value;
        if(!p18) continue;
        const desc=((ent.descriptions||{}).fr||{}).value||'';
        const inst=(claims.P31||[]).map(x=>x.mainsnak?.datavalue?.value?.id||'');
        const occ=(claims.P106||[]).map(x=>x.mainsnak?.datavalue?.value?.id||'');
        const musical= /musicien|chanteur|chanteuse|groupe|artiste|musical/i.test(desc) || inst.some(x=>['Q215380','Q5741069','Q1053574','Q2088357'].includes(x)) || occ.length>0;
        if(!musical) continue;
        return 'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(p18.replace(/ /g,'_'));
      }
    }catch(e){}
    return '';
  }

  async function artistImage(author){
    const fixed=fixedArtist(author);
    if(fixed) return fixed.image;
    const k=keyFor(author);
    try{
      const u=localStorage.getItem('UNIFIED_ARTIST_IMG_V2_'+k);
      if(u){ const j=JSON.parse(u); if(j?.url) return j.url; }
    }catch(e){}
    try{
      const u=localStorage.getItem('CALENDAR_ARTIST_IMG_V1_'+k);
      if(u){ const j=JSON.parse(u); if(j?.url) return j.url; }
    }catch(e){}
    try{
      const u=localStorage.getItem('AUTHOR_IMG_'+k);
      if(u){ const j=JSON.parse(u); if(j?.url) return j.url; }
    }catch(e){}
    const url=await wikidataImage(author);
    if(url){ try{ localStorage.setItem('UNIFIED_ARTIST_IMG_V2_'+k, JSON.stringify({url})); }catch(e){} }
    return url;
  }

  function setAuthorWiki(author){
    const el=document.getElementById('auteur');
    if(!el) return;
    const name=String(author||'').trim();
    if(!name){el.textContent='—'; return;}
    const fixed=fixedArtist(name);
    if(fixed){
      el.innerHTML='<a href="'+fixed.wiki.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener noreferrer" class="underline text-indigo-600 hover:text-indigo-800">'+name+' ↗</a>';
      return;
    }
    // Pour les artistes non ambigus, recherche Wikidata/Wikipedia sans utiliser le mot seul comme URL.
    el.textContent=name;
    (async()=>{
      try{
        const u='https://fr.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch='+encodeURIComponent(name+' musicien chanteur groupe')+'&gsrnamespace=0&gsrlimit=1&prop=info&inprop=url';
        const r=await fetch(u); if(!r.ok)return;
        const j=await r.json(); const pg=Object.values(j?.query?.pages||{})[0];
        if(pg?.fullurl && document.getElementById('auteur')){
          document.getElementById('auteur').innerHTML='<a href="'+pg.fullurl.replace(/"/g,'&quot;')+'" target="_blank" rel="noopener noreferrer" class="underline text-indigo-600 hover:text-indigo-800">'+name+' ↗</a>';
        }
      }catch(e){}
    })();
  }

  async function renderFinalDetail(date){
    const d=String(date||'').slice(0,10);
    const item=itemForDate(d) || {};
    const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v||'—';};
    set('dateLbl',d);
    set('titre',typeof displayTitle==="function" ? displayTitle(item) : (item.title||item.titre));
    setAuthorWiki(item.author||item.auteur);
    set('origine',item.origin||item['origine (pays auteur)']);
    // Mise à jour immédiate du drapeau après avoir écrit le pays.
    try{
      const originValue = item.origin || item['origine (pays auteur)'] || '';
      if(typeof window.__refreshFlag === 'function') window.__refreshFlag(originValue);
    }catch(e){}
    set('instruments',item.instruments);
    const yt=item.youtube||item['lien youtube']||'';
    const ytFrame=document.getElementById('ytFrame');
    if(ytFrame){
      let src='';
      try{const u=new URL(yt); const id=u.hostname.includes('youtu.be')?u.pathname.slice(1):u.searchParams.get('v'); if(id)src='https://www.youtube.com/embed/'+id;}catch(e){}
      ytFrame.src=src;
    }
    const mapFrame=document.getElementById('mapFrame');
    if(mapFrame) mapFrame.src=item.origin||item['origine (pays auteur)'] ? 'https://www.google.com/maps?q='+encodeURIComponent(item.origin||item['origine (pays auteur)'])+'&output=embed' : '';
    const photo=document.getElementById('authorImg');
    if(photo){
      photo.style.display='block';
      photo.removeAttribute('src');
      const url=await artistImage(item.author||item.auteur);
      if(url){ photo.src=url; photo.alt='Photo de '+(item.author||item.auteur||'artiste'); }
      else { photo.style.display='none'; }
    }
    const status=document.getElementById('authorImgStatus');
    if(status) status.textContent='';
    const credit=document.getElementById('authorImgCredit');
    if(credit) credit.textContent='';
  }

  function openDetail(date){
    const d=String(date||'').slice(0,10);
    if(!itemForDate(d)) return;
    const cal=document.getElementById('viewCalendar'), det=document.getElementById('viewDetail');
    if(cal){ cal.classList.add('hidden'); cal.classList.remove('show'); }
    if(det){
      det.classList.remove('hidden');
      det.classList.add('show');
      det.style.opacity = '1';
      det.style.transform = 'none';
      det.style.display = '';
    }
    try{ history.replaceState(null,'','#/date='+encodeURIComponent(d)); }catch(e){ location.hash='#/date='+encodeURIComponent(d); }
    renderFinalDetail(d);
  }

  // Intercepte le clic AVANT les anciens handlers : c'est la correction de la fiche vierge.
  document.addEventListener('click',function(ev){
    const cell=ev.target && ev.target.closest ? ev.target.closest('#grid .day[data-date]') : null;
    if(cell){
      const d=cell.dataset.date;
      if(d && itemForDate(d)){
        ev.preventDefault(); ev.stopImmediatePropagation();
        openDetail(d);
      }
    }
  },true);

  // Photos du calendrier : on remplace les résultats ambigus par l'identité musicale exacte.
  let calendarPhotoTimer = null;
  let calendarPhotoRun = 0;
  async function refreshCalendarPhotos(){
    const run = ++calendarPhotoRun;
    const grid=document.getElementById('grid'); if(!grid)return;
    const cells = Array.from(grid.querySelectorAll('.day[data-date]'));
    const jobs = [];
    const seen = new Set();
    for(const cell of cells){
      const item=itemForDate(cell.dataset.date); if(!item)continue;
      const author=(item.author||item.auteur||'').trim();
      if(!author)continue;
      const key=author.toLowerCase();
      if(seen.has(key))continue;
      seen.add(key);
      jobs.push({author, cells:cells.filter(c=>{ const it=itemForDate(c.dataset.date); return ((it?.author||it?.auteur||'').trim().toLowerCase()===key); })});
    }
    // Ne bloque jamais l'affichage du calendrier : les photos sont chargées après le rendu.
    const concurrency = 6;
    let next = 0;
    async function worker(){
      while(next < jobs.length){
        const job = jobs[next++];
        const url = await artistImage(job.author).catch(()=>"");
        if(run !== calendarPhotoRun || !url) continue;
        for(const cell of job.cells){
          if(!document.body.contains(cell)) continue;
          if(cell.querySelector('.calendar-artist-photo')) continue;
          cell.classList.add('has-artist-photo');
          const img=document.createElement('img');
          img.className='calendar-artist-photo'; img.loading='lazy'; img.decoding='async'; img.alt='Photo de '+job.author; img.src=url;
          img.onerror=()=>{img.remove(); cell.classList.remove('has-artist-photo');};
          const shade=cell.querySelector('.calendar-photo-shade');
          if(shade) cell.insertBefore(img,shade); else cell.prepend(img);
        }
      }
    }
    await Promise.all(Array.from({length:Math.min(concurrency,jobs.length)},()=>worker()));
  }
  const oldRC=window.renderCalendar;
  window.renderCalendar=function(){
    if(typeof oldRC==='function') oldRC.apply(this,arguments);
    if(calendarPhotoTimer) clearTimeout(calendarPhotoTimer);
    calendarPhotoTimer=setTimeout(()=>{ calendarPhotoTimer=null; refreshCalendarPhotos(); },180);
  };

  // Retour calendrier : réaffiche le calendrier sans réutiliser l'ancien routeur.
  document.addEventListener('click',function(ev){
    if(ev.target && ev.target.closest && ev.target.closest('#backBtn')){
      ev.preventDefault(); ev.stopImmediatePropagation();
      const cal=document.getElementById('viewCalendar'), det=document.getElementById('viewDetail');
      if(det){ det.classList.add('hidden'); det.classList.remove('show'); det.style.opacity=''; det.style.transform=''; }
      if(cal){ cal.classList.remove('hidden'); cal.classList.add('show'); cal.style.opacity='1'; cal.style.transform='none'; cal.style.display=''; }
      try{history.replaceState(null,'','#/');}catch(e){location.hash='#/';}
      if(typeof window.renderCalendar==='function')window.renderCalendar();
    }
  },true);

  // Si le fichier est ouvert directement sur une fiche, la rendre immédiatement.
  document.addEventListener('DOMContentLoaded',function(){
    const m=(location.hash||'').match(/^#\/date=(.+)$/);
    if(m) openDetail(decodeURIComponent(m[1]));
    else setTimeout(refreshCalendarPhotos,150);
  });
})();
</script>

<script>
(function(){
  'use strict';

  function parisToday(){
    try{
      return new Date().toLocaleString('sv-SE',{timeZone:'Europe/Paris',hour12:false}).slice(0,10);
    }catch(e){
      const d=new Date();
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    }
  }

  function isFuture(d){
    return String(d||'').slice(0,10) > parisToday();
  }

  function dataArray(){
    if(Array.isArray(window.DATA) && window.DATA.length) return window.DATA;
    if(Array.isArray(window.MUSIC_DATA) && window.MUSIC_DATA.length) return window.MUSIC_DATA;
    try{
      const a=JSON.parse(localStorage.getItem('MUSIC_DATA_JSON')||'[]');
      return Array.isArray(a)?a:[];
    }catch(e){ return []; }
  }

  function itemForDate(d){
    const key=String(d||'').slice(0,10);
    return dataArray().find(x=>String(x?.date||'').slice(0,10)===key) || null;
  }

  function lockFutureCell(cell){
    if(!cell) return;
    const d=String(cell.dataset.date||'').slice(0,10);
    if(!d || !itemForDate(d)) return;

    if(isFuture(d)){
      cell.classList.add('future-locked');
      cell.setAttribute('aria-disabled','true');
      cell.setAttribute('title','Ce morceau sera disponible le '+d+'.');
      cell.style.cursor='not-allowed';

      // On masque les informations du morceau, mais on conserve le numéro du jour.
      const num=cell.querySelector('.calendar-day-number');
      const copy=cell.querySelector('.calendar-copy');
      if(copy){
        copy.innerHTML='<span class="calendar-title">🔒 À découvrir</span>'+
                       '<span class="calendar-author">Disponible le '+d+'</span>';
      }else{
        const html='<span class="calendar-day-number">'+(Number(d.slice(8,10)))+'</span>'+
          '<div class="calendar-copy"><span class="calendar-title">🔒 À découvrir</span>'+
          '<span class="calendar-author">Disponible le '+d+'</span></div>';
        cell.innerHTML=html;
      }
      cell.querySelectorAll('img.calendar-artist-photo,.calendar-photo-shade,.calendar-photo-placeholder')
          .forEach(el=>el.remove());
      cell.classList.remove('has-artist-photo');
    }else{
      // IMPORTANT : les dates passées et la date du jour restent totalement accessibles.
      cell.classList.remove('future-locked');
      cell.removeAttribute('aria-disabled');
      cell.removeAttribute('title');
      cell.style.cursor='';
      cell.style.opacity='';
    }
  }

  function enforce(){
    document.querySelectorAll('#grid .day[data-date]').forEach(lockFutureCell);
  }

  // Le clic est intercepté au niveau WINDOW, donc avant les anciens gestionnaires
  // enregistrés sur document. Les dates passées passent normalement.
  window.addEventListener('click',function(ev){
    const cell=ev.target && ev.target.closest ? ev.target.closest('#grid .day[data-date]') : null;
    if(!cell) return;
    const d=String(cell.dataset.date||'').slice(0,10);
    if(isFuture(d)){
      ev.preventDefault();
      ev.stopPropagation();
      ev.stopImmediatePropagation();
    }
  },true);

  // Empêche aussi l'accès direct par #/date=YYYY-MM-DD pour une date future.
  function guardHash(){
    const m=(location.hash||'').match(/^#\/date=(.+)$/);
    if(!m) return;
    let d='';
    try{ d=decodeURIComponent(m[1]).slice(0,10); }catch(e){}
    if(isFuture(d)){
      history.replaceState(null,'','#/');
      const cal=document.getElementById('viewCalendar');
      const det=document.getElementById('viewDetail');
      if(det){det.classList.add('hidden');det.classList.remove('show');det.style.display='none';}
      if(cal){cal.classList.remove('hidden');cal.classList.add('show');cal.style.display='';}
      if(typeof window.renderCalendar==='function') setTimeout(enforce,0);
    }
  }

  window.addEventListener('hashchange',guardHash,true);

  // Si un ancien routeur a ouvert une fiche future avant ce patch, on la referme.
  function guardCurrentView(){
    guardHash();
    enforce();
  }

  // Après chaque rendu, on verrouille uniquement les dates futures.
  const previousRenderCalendar=window.renderCalendar;
  window.renderCalendar=function(){
    if(typeof previousRenderCalendar==='function'){
      previousRenderCalendar.apply(this,arguments);
    }
    setTimeout(enforce,0);
    setTimeout(enforce,80);
  };

  // Quand les données Excel viennent d'être chargées, si le mois courant
  // ne contient aucun morceau, afficher le mois musical le plus récent,
  // pas le premier mois de l'année. Les mois passés restent navigables.
  function moveToLatestUsefulMonth(){
    const arr=dataArray();
    if(!arr.length) return false;
    const count=document.getElementById('countMonth');
    const prev=document.getElementById('prev');
    if(!count || !prev) return false;
    // renderCalendar écrit le nombre de morceaux du mois dans #countMonth.
    // Si le mois courant est vide, on remonte jusqu'au dernier mois contenant
    // réellement un morceau passé ou présent.
    let n=0;
    while(String(count.textContent||'').trim()==='0' && n<120){
      prev.click();
      n++;
    }
    return n>0;
  }

  document.addEventListener('DOMContentLoaded',function(){
    setTimeout(function(){
      // DATA peut être chargé automatiquement un peu après DOMContentLoaded.
      if(moveToLatestUsefulMonth() && typeof window.renderCalendar==='function'){
        window.renderCalendar();
      }
      guardCurrentView();
      setTimeout(guardCurrentView,250);
    },350);
  });

  // Après le chargement automatique de musique.xlsx, renderCalendar est appelé :
  // notre wrapper ci-dessus réapplique alors le verrouillage.
})();
</script>
