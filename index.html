<script>
(function(){
  function norm(v){
    return String(v||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  }
  function findCalendarPhoto(author){
    const target=norm(author);
    if(!target) return '';
    const imgs=Array.from(document.querySelectorAll('#grid img.calendar-artist-photo'));
    // 1) correspondance exacte sur l'alt fourni par le calendrier
    for(const img of imgs){
      const alt=norm((img.getAttribute('alt')||'').replace(/^photo de\s*/i,''));
      if(alt===target && img.currentSrc) return img.currentSrc;
    }
    // 2) correspondance sur la cellule contenant le nom de l'artiste
    for(const img of imgs){
      const cell=img.closest('.day');
      if(!cell) continue;
      const text=norm(cell.textContent);
      if(text.includes(target) && img.currentSrc) return img.currentSrc;
    }
    return '';
  }
  function getFallback(author){
    const k=norm(author);
    if(!k) return '';
    try{const x=localStorage.getItem('UNIFIED_ARTIST_IMG_V2_'+k);if(x)return JSON.parse(x)?.url||'';}catch(e){}
    try{const x=localStorage.getItem('AUTHOR_IMG_'+k);if(x)return JSON.parse(x)?.url||'';}catch(e){}
    try{const x=localStorage.getItem('CALENDAR_ARTIST_IMG_V1_'+k);if(x)return JSON.parse(x)?.url||'';}catch(e){}
    return '';
  }
  function syncExact(){
    const img=document.getElementById('authorImg');
    if(!img) return;
    const author=(document.getElementById('auteur')?.textContent||'').trim();
    if(!author || author==='—') return;
    const exact=findCalendarPhoto(author);
    const url=exact || getFallback(author);
    if(url){
      img.src=url;
      img.style.display='';
      img.alt='Photo de '+author;
      img.dataset.source='calendar-exact';
    }
  }
  window.__syncExactCalendarArtistPhoto=syncExact;
  const oldRender=window.renderDetail;
  if(typeof oldRender==='function'){
    window.renderDetail=function(){
      const r=oldRender.apply(this,arguments);
      // Le calendrier est la source de vérité pour la photo.
      setTimeout(syncExact,0);
      setTimeout(syncExact,120);
      setTimeout(syncExact,500);
      return r;
    };
  }
  document.addEventListener('DOMContentLoaded',()=>{
    syncExact();
    setTimeout(syncExact,200);
    setTimeout(syncExact,700);
  });
  // Si la photo du calendrier arrive après l'ouverture de la fiche, on resynchronise.
  const grid=document.getElementById('grid');
  if(grid){
    const obs=new MutationObserver(()=>syncExact());
    obs.observe(grid,{childList:true,subtree:true,attributes:true,attributeFilter:['src']});
  }
})();
</script>

<script>
(function(){
  function parisToday(){
    try{ return new Date().toLocaleString("sv-SE",{timeZone:"Europe/Paris",hour12:false}).slice(0,10); }
    catch(e){ return new Date().toISOString().slice(0,10); }
  }
  function markToday(){
    const today = parisToday();
    document.querySelectorAll("#grid .day[data-date]").forEach(function(cell){
      cell.classList.toggle("is-today", cell.dataset.date === today);
    });
  }
  function openToday(){
    const today = parisToday();
    const parts = today.split("-");
    if(typeof curY !== "undefined" && typeof curM !== "undefined" && parts.length === 3){
      curY = Number(parts[0]);
      curM = Number(parts[1]) - 1;
      if(typeof renderCalendar === "function") renderCalendar();
    }
    const cell = document.querySelector('#grid .day[data-date="'+today+'"]');
    if(cell && !cell.classList.contains("future-locked")){
      cell.click();
      return;
    }
    location.hash = "#/date=" + encodeURIComponent(today);
  }
  const btn = document.getElementById("todayBtn");
  if(btn) btn.addEventListener("click", openToday);
  const grid = document.getElementById("grid");
  if(grid && window.MutationObserver){
    new MutationObserver(markToday).observe(grid, {childList:true, subtree:true});
  }
  document.addEventListener("DOMContentLoaded", markToday);
  window.addEventListener("hashchange", function(){ setTimeout(markToday, 50); });
})();
</script>
